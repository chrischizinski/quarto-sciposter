name: render-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # Theme font stack falls back to Liberation Sans on Linux.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      # examples/r-figures.qmd needs R + ggplot2, and examples/python.qmd
      # needs matplotlib, seaborn and plotnine; keep CI lean and render only
      # the pure-markdown posters. Both computed examples are exercised
      # locally.
      # qr-codes.qmd is the only poster that resolves a Typst package
      # (tiaoma, fetched lazily on first use). Rendering it here is what
      # catches a package or registry breakage that no other example would.
      - name: Render posters
        run: |
          quarto render template.qmd --to sciposter-typst
          quarto render examples/a0-portrait.qmd --to sciposter-typst
          quarto render examples/qr-codes.qmd --to sciposter-typst
          quarto render examples/tables.qmd --to sciposter-typst --metadata keep-typ=true
          quarto render examples/template-controls.qmd --to sciposter-typst

      # No table should carry a size of its own: on an A1 poster an absolute
      # 9-12pt is a third of the ~27pt body, unreadable at distance, and
      # nothing warns at render time. The Lua filter strips CSS `font-size`
      # off HTML tables, which is what gt and hand-written HTML emit; this
      # checks the filter actually ran.
      # Match the emission itself, not the number: "9pt" also occurs in the
      # template's draft panel and in the poster's own prose about this trap.
      # The declarations before `size:` vary — Quarto writes the font list
      # first when the source CSS set one — so match across them rather than
      # requiring `size:` to come first.
      - name: Check no table carries an absolute font size
        run: |
          if grep -qE 'set text\([^;]*size: [0-9.]+pt[^;]*\);table\(' examples/tables.typ; then
            echo "a table carries its own absolute font size"
            exit 1
          fi
          echo "no absolute table size emitted"

      # A guard that cannot fail is not a guard. The fixture renders with
      # `table-css: keep`, so the size the grep looks for is still there; if
      # this step stops finding one, the check above is passing vacuously.
      # Testing the pattern rather than the packages is deliberate — it is the
      # emission shape that broke before, and reproducing it from raw HTML
      # costs nothing, where installing R and gt to produce the same string
      # would cost minutes on every run.
      - name: Check the guard can still fail
        run: |
          quarto render tests/table-guard.qmd \
            --to sciposter-typst --metadata keep-typ=true
          if grep -qE 'set text\([^;]*size: [0-9.]+pt[^;]*\);table\(' tests/table-guard.typ; then
            echo "guard fires on the fixture, as it must"
          else
            echo "guard did NOT fire on a table that kept its CSS size"
            exit 1
          fi

      # A bottom-pinned .full-width float shortens the columns region, but the
      # body sits in a fixed-height grid row that Typst will not clip, so
      # column text that outgrows the region keeps drawing straight under the
      # float. One page, well inside the page bottom, invisible — which is how
      # a heading and a paragraph went missing from template.qmd once already.
      # The fixture ends its body inside the float's span on purpose; a hit on
      # the other message means it drifted into the plain-overflow branch and
      # is no longer testing this.
      - name: Check the overflow guard sees content hidden by a float
        run: |
          sudo apt-get install -y poppler-utils
          quarto render tests/overflow-float.qmd --to sciposter-typst
          text=$(pdftotext tests/overflow-float.pdf -)
          if echo "$text" | grep -q 'CUT OFF'; then
            echo "fixture tripped the plain-overflow branch, not the float one"
            exit 1
          fi
          if echo "$text" | grep -q 'HIDDEN'; then
            echo "guard fires on content drawn under a bottom float, as it must"
          else
            echo "guard did NOT fire on content hidden behind a full-width float"
            exit 1
          fi

      # Every poster-level control at once. The overflow guard is the check
      # that matters here: theme-overrides can change the heading size, and
      # block-gap the rhythm, either of which can push a fitting poster over.
      - name: Check the controls example stays quiet
        run: |
          if pdftotext examples/template-controls.pdf - | grep -q 'CONTENT OVERFLOW'; then
            echo "template-controls.pdf overflowed"
            exit 1
          fi
          echo "template-controls.pdf fits"

      # The negative control for the step above: template.qmd carries a
      # bottom-pinned float of its own and fits, so it must stay quiet. Without
      # this a guard that warned on every float would look green.
      - name: Check a healthy poster with a bottom float stays quiet
        run: |
          if pdftotext template.pdf - | grep -q 'CONTENT OVERFLOW'; then
            echo "template.pdf warns about overflow but fits"
            exit 1
          fi
          echo "template.pdf carries a bottom float and does not warn"

      - name: Check page dimensions
        run: |
          pdfinfo template.pdf | grep -q "3456 x 2592" || { echo "template.pdf wrong size"; exit 1; }
          pdfinfo examples/a0-portrait.pdf | grep -q "A0" || { echo "a0-portrait.pdf wrong size"; exit 1; }
          for f in template.pdf examples/a0-portrait.pdf examples/qr-codes.pdf examples/tables.pdf examples/template-controls.pdf; do
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            [ "$pages" = "1" ] || { echo "$f overflowed to $pages pages"; exit 1; }
          done
